# Weekly refresh of the vendored upstream skills.
# Opens a pull request when an upstream moves. Never pushes to the default
# branch, and never touches voice/.
#
# One repo setting is required: Settings > Actions > General > Workflow
# permissions > "Allow GitHub Actions to create and approve pull requests".

name: upstream update

on:
  schedule:
    - cron: '17 9 * * 1' # Mondays, 09:17 UTC
  workflow_dispatch: # and on demand from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests and updater
        id: update
        run: |
          node --test scripts/*.test.mjs
          node scripts/update.mjs | tee /tmp/update.log
          echo 'log<<EOF' >> "$GITHUB_OUTPUT"
          cat /tmp/update.log >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"

      - name: Fail if voice was modified
        run: |
          if ! git diff --quiet -- voice; then
            echo "The updater modified voice/. That should be impossible."
            git diff --stat -- voice
            exit 1
          fi

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: upstream-update
          title: 'Refresh vendored upstreams'
          commit-message: 'Refresh vendored upstreams'
          delete-branch: true
          body: |
            Automated refresh of the vendored upstream skills.

            ```
            ${{ steps.update.outputs.log }}
            ```

            `voice/` was not modified; the job fails if it was.

            Check whether any upstream change conflicts with a rule in
            `voice/` before merging.
