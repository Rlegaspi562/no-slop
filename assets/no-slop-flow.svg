<svg xmlns="http://www.w3.org/2000/svg" width="960" height="2160" viewBox="0 0 960 2160" role="img" aria-labelledby="title desc">
  <title id="title">How the No Slop Claude Code skill works and improves</title>
  <desc id="desc">A readable top-down diagram. No Slop receives a request for public-facing work and chooses a writing path or interface path. Writing uses the Humanizer and Stop Slop skills. Interfaces use the Taste Skill and, when installed, Impeccable. No Slop then applies personal rules, samples, exceptions, and saved corrections. It performs a final review, and an optional Stop hook checks that review when Claude tries to finish. A separate ongoing improvement section shows reviewable community updates and approved voice corrections saved for later work.</desc>

  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#bd5f3b"/>
    </marker>
  </defs>

  <rect width="960" height="2160" fill="#f5f1e8"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="46" y="60" fill="#191816" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700">How the /no-slop skill runs</text>
    <text x="46" y="98" fill="#57524b" font-size="19">A Claude Code skill is a folder of instructions for handling a specific kind of task.</text>

    <rect x="46" y="136" width="868" height="124" rx="14" fill="#fffdf8" stroke="#292621" stroke-width="2"/>
    <text x="78" y="181" fill="#bd5f3b" font-size="17" font-weight="800" letter-spacing="1.1">THE REQUEST</text>
    <text x="78" y="220" fill="#191816" font-size="25" font-weight="800">Claude receives public-facing writing or interface work.</text>
    <text x="78" y="246" fill="#57524b" font-size="17">Examples: email, README, video script, website, dashboard, presentation</text>

    <path d="M480 261 L480 298" stroke="#bd5f3b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="46" y="318" width="868" height="352" rx="14" fill="#e9e2d6" stroke="#292621" stroke-width="2"/>
    <text x="78" y="361" fill="#8b432c" font-size="19" font-weight="800">No Slop chooses the appropriate path</text>
    <text x="78" y="391" fill="#4c4741" font-size="18">The request determines which source skills Claude reads and applies.</text>

    <rect x="78" y="424" width="390" height="210" rx="12" fill="#fffdf8" stroke="#8c8478" stroke-width="1.5"/>
    <text x="104" y="465" fill="#625c54" font-size="16" font-weight="800" letter-spacing="1">WRITING</text>
    <text x="104" y="505" fill="#191816" font-size="23" font-weight="800">Humanizer skill</text>
    <text x="104" y="534" fill="#4c4741" font-size="17">Finds common AI-writing patterns.</text>
    <text x="104" y="575" fill="#191816" font-size="23" font-weight="800">Stop Slop skill</text>
    <text x="104" y="604" fill="#4c4741" font-size="17">Checks directness, rhythm, trust, and density.</text>

    <rect x="492" y="424" width="390" height="210" rx="12" fill="#fffdf8" stroke="#8c8478" stroke-width="1.5"/>
    <text x="518" y="465" fill="#625c54" font-size="16" font-weight="800" letter-spacing="1">WEBSITE OR INTERFACE</text>
    <text x="518" y="505" fill="#191816" font-size="23" font-weight="800">Taste Skill</text>
    <text x="518" y="534" fill="#4c4741" font-size="17">Chooses a clear visual direction.</text>
    <text x="518" y="575" fill="#191816" font-size="23" font-weight="800">Impeccable skill, when installed</text>
    <text x="518" y="604" fill="#4c4741" font-size="17">Checks generic patterns and technical quality.</text>

    <path d="M480 671 L480 710" stroke="#bd5f3b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="46" y="730" width="868" height="290" rx="14" fill="#dcd1c1" stroke="#292621" stroke-width="2"/>
    <text x="78" y="775" fill="#8b432c" font-size="19" font-weight="800">Then No Slop applies your voice and taste</text>
    <text x="78" y="809" fill="#38342f" font-size="18">These personal files run after the broad anti-slop checks:</text>

    <circle cx="90" cy="862" r="5" fill="#bd5f3b"/>
    <text x="112" y="869" fill="#191816" font-size="19"><tspan font-weight="800">Rules:</tspan> preferences and banned choices</text>
    <circle cx="90" cy="910" r="5" fill="#bd5f3b"/>
    <text x="112" y="917" fill="#191816" font-size="19"><tspan font-weight="800">Samples:</tspan> how you speak and write</text>
    <circle cx="505" cy="862" r="5" fill="#bd5f3b"/>
    <text x="527" y="869" fill="#191816" font-size="19"><tspan font-weight="800">Exceptions:</tspan> unusual choices that are yours</text>
    <circle cx="505" cy="910" r="5" fill="#bd5f3b"/>
    <text x="527" y="917" fill="#191816" font-size="19"><tspan font-weight="800">Corrections:</tspan> feedback saved for later</text>

    <rect x="78" y="956" width="804" height="42" rx="7" fill="#fff7ef"/>
    <text x="480" y="983" text-anchor="middle" fill="#7f3f29" font-size="18" font-weight="800">If a broad rule disagrees with your documented voice, your voice is kept.</text>

    <path d="M480 1021 L480 1060" stroke="#bd5f3b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="46" y="1080" width="868" height="142" rx="14" fill="#fffdf8" stroke="#292621" stroke-width="2"/>
    <text x="78" y="1124" fill="#8b432c" font-size="18" font-weight="800">No Slop performs the final review</text>
    <text x="78" y="1162" fill="#191816" font-size="20" font-weight="700">Claude rereads the work, finds what still feels generic or unverified, and fixes it.</text>
    <text x="78" y="1195" fill="#57524b" font-size="17">This review is inside No Slop. It is not another skill to install.</text>

    <path d="M480 1223 L480 1262" stroke="#bd5f3b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="46" y="1282" width="868" height="152" rx="14" fill="#fff7ef" stroke="#bd5f3b" stroke-width="2"/>
    <text x="78" y="1327" fill="#8b432c" font-size="18" font-weight="800">Optional Stop hook checks that the review happened</text>
    <text x="78" y="1365" fill="#191816" font-size="20" font-weight="700">When Claude tries to finish, the hook sends it back if the review is missing.</text>
    <text x="78" y="1400" fill="#57524b" font-size="17">The hook does not rewrite the work. It only checks the completion step.</text>

    <path d="M480 1435 L480 1472" stroke="#bd5f3b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="115" y="1492" width="730" height="64" rx="10" fill="#292621"/>
    <text x="480" y="1533" text-anchor="middle" fill="#fffdf8" font-size="21" font-weight="800">Result: public-facing work that sounds like you and looks intentional.</text>

    <line x1="46" y1="1610" x2="914" y2="1610" stroke="#a79e91" stroke-width="2"/>
    <text x="46" y="1664" fill="#191816" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">How later requests improve</text>
    <text x="46" y="1698" fill="#57524b" font-size="19">Community changes and personal corrections use separate, protected paths.</text>

    <rect x="46" y="1740" width="414" height="352" rx="14" fill="#292621"/>
    <text x="76" y="1785" fill="#f2aa83" font-size="20" font-weight="800">Community skill updates</text>
    <text x="76" y="1817" fill="#d8d0c4" font-size="17">When the scheduled GitHub task is enabled:</text>

    <circle cx="91" cy="1861" r="16" fill="#bd5f3b"/>
    <text x="91" y="1867" text-anchor="middle" fill="#fffdf8" font-size="14" font-weight="800">1</text>
    <text x="120" y="1867" fill="#fffdf8" font-size="18" font-weight="700">Check the creators' repositories.</text>
    <circle cx="91" cy="1923" r="16" fill="#bd5f3b"/>
    <text x="91" y="1929" text-anchor="middle" fill="#fffdf8" font-size="14" font-weight="800">2</text>
    <text x="120" y="1918" fill="#fffdf8" font-size="18" font-weight="700">Open a proposed update</text>
    <text x="120" y="1943" fill="#d8d0c4" font-size="17">when copied files changed.</text>
    <circle cx="91" cy="1992" r="16" fill="#bd5f3b"/>
    <text x="91" y="1998" text-anchor="middle" fill="#fffdf8" font-size="14" font-weight="800">3</text>
    <text x="120" y="1987" fill="#fffdf8" font-size="18" font-weight="700">You review and accept it.</text>
    <text x="120" y="2012" fill="#d8d0c4" font-size="17">Nothing changes before approval.</text>
    <text x="76" y="2064" fill="#f2aa83" font-size="17" font-weight="800">Your voice files cannot be changed here.</text>

    <rect x="500" y="1740" width="414" height="352" rx="14" fill="#fffdf8" stroke="#292621" stroke-width="2"/>
    <text x="530" y="1785" fill="#8b432c" font-size="20" font-weight="800">Your voice and taste updates</text>
    <text x="530" y="1817" fill="#57524b" font-size="17">When you approve a correction:</text>

    <circle cx="545" cy="1861" r="16" fill="#bd5f3b"/>
    <text x="545" y="1867" text-anchor="middle" fill="#fffdf8" font-size="14" font-weight="800">1</text>
    <text x="574" y="1867" fill="#191816" font-size="18" font-weight="700">You correct the output.</text>
    <circle cx="545" cy="1923" r="16" fill="#bd5f3b"/>
    <text x="545" y="1929" text-anchor="middle" fill="#fffdf8" font-size="14" font-weight="800">2</text>
    <text x="574" y="1918" fill="#191816" font-size="18" font-weight="700">The agent saves the rule</text>
    <text x="574" y="1943" fill="#57524b" font-size="17">in your personal files.</text>
    <circle cx="545" cy="1992" r="16" fill="#bd5f3b"/>
    <text x="545" y="1998" text-anchor="middle" fill="#fffdf8" font-size="14" font-weight="800">3</text>
    <text x="574" y="1987" fill="#191816" font-size="18" font-weight="700">Later work applies it</text>
    <text x="574" y="2012" fill="#57524b" font-size="17">after the broad checks.</text>
    <text x="530" y="2064" fill="#8b432c" font-size="17" font-weight="800">This is saved memory, not model training.</text>

    <text x="480" y="2132" text-anchor="middle" fill="#4b4640" font-size="19" font-weight="800">The shared checks can stay current without overwriting what makes the work yours.</text>
  </g>
</svg>
