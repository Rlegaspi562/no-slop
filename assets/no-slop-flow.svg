<svg xmlns="http://www.w3.org/2000/svg" width="960" height="2320" viewBox="0 0 960 2320" role="img" aria-labelledby="title desc">
  <title id="title">How the no-slop Agent Skill works and improves</title>
  <desc id="desc">A readable top-down diagram. The user's LLM-powered agent receives a request for public-facing work. The no-slop skill chooses a writing route or interface route. Writing uses the humanizer and stop-slop skills. Interfaces use the taste skill and, when installed, impeccable. No-slop then applies personal rules, samples, exceptions, and saved corrections before a final review. An optional completion hook can check that the review happened in any agent with a compatible hook system. A separate section explains the optional weekly GitHub workflow and how approved personal corrections improve later work.</desc>

  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#bd5f3b"/>
    </marker>
  </defs>

  <rect width="960" height="2320" fill="#f5f1e8"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="46" y="60" fill="#191816" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700">How the /no-slop skill runs</text>
    <text x="46" y="98" fill="#57524b" font-size="19">An Agent Skill is a folder of instructions for handling a specific kind of task.</text>

    <rect x="46" y="136" width="868" height="124" rx="14" fill="#fffdf8" stroke="#292621" stroke-width="2"/>
    <text x="78" y="181" fill="#bd5f3b" font-size="17" font-weight="800" letter-spacing="1.1">THE REQUEST</text>
    <text x="78" y="220" fill="#191816" font-size="25" font-weight="800">Your agent receives public-facing writing or interface work.</text>
    <text x="78" y="246" fill="#57524b" font-size="17">Your agent can be whatever LLM-powered agent you use.</text>

    <path d="M480 261 L480 298" stroke="#bd5f3b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="46" y="318" width="868" height="352" rx="14" fill="#e9e2d6" stroke="#292621" stroke-width="2"/>
    <text x="78" y="361" fill="#8b432c" font-size="19" font-weight="800">/no-slop chooses the appropriate path</text>
    <text x="78" y="391" fill="#4c4741" font-size="18">The request determines which source skills your agent reads and applies.</text>

    <rect x="78" y="424" width="390" height="210" rx="12" fill="#fffdf8" stroke="#8c8478" stroke-width="1.5"/>
    <text x="104" y="465" fill="#625c54" font-size="16" font-weight="800" letter-spacing="1">SKILLS FOR WRITING</text>
    <text x="104" y="505" fill="#191816" font-size="23" font-weight="800">/humanizer</text>
    <text x="104" y="534" fill="#4c4741" font-size="17">Finds common AI-writing patterns.</text>
    <text x="104" y="575" fill="#191816" font-size="23" font-weight="800">/stop-slop</text>
    <text x="104" y="604" fill="#4c4741" font-size="17">Checks directness, rhythm, trust, and density.</text>

    <rect x="492" y="424" width="390" height="210" rx="12" fill="#fffdf8" stroke="#8c8478" stroke-width="1.5"/>
    <text x="518" y="465" fill="#625c54" font-size="15" font-weight="800" letter-spacing="0.7">SKILLS FOR WEBSITES OR INTERFACES</text>
    <text x="518" y="505" fill="#191816" font-size="23" font-weight="800">/taste</text>
    <text x="518" y="534" fill="#4c4741" font-size="17">Chooses a clear visual direction.</text>
    <text x="518" y="575" fill="#191816" font-size="23" font-weight="800">/impeccable, when installed</text>
    <text x="518" y="604" fill="#4c4741" font-size="17">Checks generic patterns and technical quality.</text>

    <path d="M480 671 L480 710" stroke="#bd5f3b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="46" y="730" width="868" height="290" rx="14" fill="#dcd1c1" stroke="#292621" stroke-width="2"/>
    <text x="78" y="775" fill="#8b432c" font-size="19" font-weight="800">Then /no-slop applies your voice and design taste</text>
    <text x="78" y="809" fill="#38342f" font-size="18">These personal files run after the broad anti-slop checks:</text>

    <circle cx="90" cy="862" r="5" fill="#bd5f3b"/>
    <text x="112" y="869" fill="#191816" font-size="19"><tspan font-weight="800">Rules:</tspan> preferences and banned choices</text>
    <circle cx="90" cy="910" r="5" fill="#bd5f3b"/>
    <text x="112" y="917" fill="#191816" font-size="19"><tspan font-weight="800">Samples:</tspan> how you speak and write</text>
    <circle cx="505" cy="862" r="5" fill="#bd5f3b"/>
    <text x="527" y="869" fill="#191816" font-size="19"><tspan font-weight="800">Exceptions:</tspan> unusual choices that are yours</text>
    <circle cx="505" cy="910" r="5" fill="#bd5f3b"/>
    <text x="527" y="917" fill="#191816" font-size="19"><tspan font-weight="800">Corrections:</tspan> feedback saved for later</text>

    <rect x="78" y="956" width="804" height="42" rx="7" fill="#fff7ef"/>
    <text x="480" y="983" text-anchor="middle" fill="#7f3f29" font-size="18" font-weight="800">If a broad rule disagrees with your documented voice, your voice is kept.</text>

    <path d="M480 1021 L480 1060" stroke="#bd5f3b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="46" y="1080" width="868" height="142" rx="14" fill="#fffdf8" stroke="#292621" stroke-width="2"/>
    <text x="78" y="1124" fill="#8b432c" font-size="18" font-weight="800">/no-slop performs the final review</text>
    <text x="78" y="1162" fill="#191816" font-size="20" font-weight="700">Your agent rereads the work, finds what still feels generic or unverified, and fixes it.</text>
    <text x="78" y="1195" fill="#57524b" font-size="17">This review is inside /no-slop. It is not another skill to install.</text>

    <path d="M480 1223 L480 1262" stroke="#bd5f3b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="46" y="1282" width="868" height="180" rx="14" fill="#fff7ef" stroke="#bd5f3b" stroke-width="2"/>
    <text x="78" y="1325" fill="#8b432c" font-size="18" font-weight="800">Optional completion hook checks that the review happened</text>
    <text x="78" y="1362" fill="#191816" font-size="19" font-weight="700">If your agent supports stop or completion hooks, add the /no-slop check there.</text>
    <text x="78" y="1396" fill="#57524b" font-size="17">No compatible hook? Skip it. /no-slop still performs the review itself.</text>
    <text x="78" y="1428" fill="#57524b" font-size="16">The included installer configures Claude Code; other agents use their own hook format.</text>

    <path d="M480 1463 L480 1500" stroke="#bd5f3b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="46" y="1520" width="868" height="86" rx="10" fill="#292621"/>
    <text x="480" y="1554" text-anchor="middle" fill="#fffdf8" font-size="21" font-weight="800">Result: public-facing work that sounds like you</text>
    <text x="480" y="1581" text-anchor="middle" fill="#fffdf8" font-size="21" font-weight="800">and looks intentional.</text>

    <line x1="46" y1="1655" x2="914" y2="1655" stroke="#a79e91" stroke-width="2"/>
    <text x="46" y="1709" fill="#191816" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">How later requests improve</text>
    <text x="46" y="1743" fill="#57524b" font-size="19">Source updates and your personal corrections follow separate paths.</text>

    <rect x="46" y="1785" width="868" height="300" rx="14" fill="#292621"/>
    <text x="76" y="1828" fill="#f2aa83" font-size="20" font-weight="800">Optional weekly source check on GitHub</text>
    <text x="76" y="1860" fill="#fffdf8" font-size="17" font-weight="700">Workflow file: .github/workflows/update.yml</text>
    <text x="76" y="1888" fill="#d8d0c4" font-size="17">It runs every Monday only in a GitHub repository where you enable it.</text>

    <circle cx="91" cy="1930" r="16" fill="#bd5f3b"/>
    <text x="91" y="1936" text-anchor="middle" fill="#fffdf8" font-size="14" font-weight="800">1</text>
    <text x="120" y="1936" fill="#fffdf8" font-size="17" font-weight="700">GitHub checks the original skill repositories for newer copied files.</text>
    <circle cx="91" cy="1985" r="16" fill="#bd5f3b"/>
    <text x="91" y="1991" text-anchor="middle" fill="#fffdf8" font-size="14" font-weight="800">2</text>
    <text x="120" y="1991" fill="#fffdf8" font-size="17" font-weight="700">If files changed, GitHub opens a pull request, which is a proposed update.</text>
    <circle cx="91" cy="2040" r="16" fill="#bd5f3b"/>
    <text x="91" y="2046" text-anchor="middle" fill="#fffdf8" font-size="14" font-weight="800">3</text>
    <text x="120" y="2046" fill="#fffdf8" font-size="17" font-weight="700">You inspect and merge it. Nothing changes until you approve.</text>

    <rect x="46" y="2110" width="868" height="180" rx="14" fill="#fffdf8" stroke="#292621" stroke-width="2"/>
    <text x="76" y="2153" fill="#8b432c" font-size="20" font-weight="800">Your approved corrections improve later requests</text>
    <text x="76" y="2185" fill="#57524b" font-size="17">This path stays in your personal voice files.</text>

    <circle cx="91" cy="2235" r="16" fill="#bd5f3b"/>
    <text x="91" y="2241" text-anchor="middle" fill="#fffdf8" font-size="14" font-weight="800">1</text>
    <text x="120" y="2241" fill="#191816" font-size="17" font-weight="700">You correct the output.</text>
    <circle cx="373" cy="2235" r="16" fill="#bd5f3b"/>
    <text x="373" y="2241" text-anchor="middle" fill="#fffdf8" font-size="14" font-weight="800">2</text>
    <text x="402" y="2241" fill="#191816" font-size="17" font-weight="700">Your agent saves the rule.</text>
    <circle cx="687" cy="2235" r="16" fill="#bd5f3b"/>
    <text x="687" y="2241" text-anchor="middle" fill="#fffdf8" font-size="14" font-weight="800">3</text>
    <text x="716" y="2241" fill="#191816" font-size="17" font-weight="700">Later work uses it.</text>
    <text x="402" y="2268" fill="#57524b" font-size="16">in your personal files</text>
    <text x="716" y="2268" fill="#57524b" font-size="16">after the source checks</text>
  </g>
</svg>
